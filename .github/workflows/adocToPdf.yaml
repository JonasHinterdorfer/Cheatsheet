name: Convert AsciiDoc to PDF

on:
  push:
    branches:
      - main
    paths:
      - 'cheatsheet.adoc'
      - 'cheatsheet-dotnet.adoc'
      - '.github/workflows/adocToPdf.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-to-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install AsciiDoctor and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full
          sudo gem install asciidoctor asciidoctor-pdf rouge

      - name: Convert cheatsheet.adoc to PDF
        run: |
          asciidoctor-pdf \
            -r asciidoctor-pdf \
            -r rouge \
            -a source-highlighter=rouge \
            -a rouge-style=github \
            -a pdf-theme=default \
            -o output.pdf \
            cheatsheet.adoc

      - name: Convert cheatsheet-dotnet.adoc to PDF
        run: |
          asciidoctor-pdf \
            -r asciidoctor-pdf \
            -r rouge \
            -a source-highlighter=rouge \
            -a rouge-style=github \
            -a pdf-theme=default \
            -o cheatsheet-dotnet.pdf \
            cheatsheet-dotnet.adoc

      - name: Upload cheatsheet PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheatsheet-pdf
          path: output.pdf

      - name: Upload cheatsheet-dotnet PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheatsheet-dotnet-pdf
          path: cheatsheet-dotnet.pdf

      - name: Commit and push PDFs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output.pdf cheatsheet-dotnet.pdf
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update output.pdf and cheatsheet-dotnet.pdf [skip ci]" && git push)
